<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kho Tool Cộng Đồng</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-[#070b14] text-slate-100 min-h-screen">

  <header class="border-b border-slate-800/80 py-4 px-6 sticky top-0 bg-[#070b14]/95 backdrop-blur z-50">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3 cursor-pointer" onclick="showHub()">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-cyan-500 to-purple-600 flex items-center justify-center font-black text-lg">⚡</div>
        <div>
          <h1 class="text-sm font-extrabold tracking-tight">KHO TOOL <span class="text-cyan-400">CỘNG ĐỒNG</span></h1>
          <p class="text-[10px] text-slate-400">9 Module thực chiến • 100% Client-Side</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <span id="realTaskCounter" class="text-[10px] bg-slate-800 px-3 py-1 rounded-full text-slate-300 hidden sm:inline">128.500</span>
        <button id="backBtn" onclick="showHub()" class="hidden text-xs bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-xl border border-slate-700">← Về Hub</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8">
    <div id="hub-view">
      <div class="text-center space-y-4 mb-10">
        <div class="inline-flex items-center gap-2 bg-cyan-500/10 border border-cyan-500/20 text-cyan-400 text-xs font-bold px-4 py-1.5 rounded-full">
          Zero-Server • Chạy hoàn toàn trên trình duyệt
        </div>
        <h2 class="text-3xl sm:text-4xl font-black tracking-tight">Hệ thống Tool thực chiến</h2>
        <p class="text-sm text-slate-400 max-w-xl mx-auto">Chọn tool để bắt đầu. Không cần cài đặt, không cần server.</p>
        <input id="searchInput" type="text" placeholder="Tìm tool (Excel, QR, Data, Ảnh...)" 
               class="w-full max-w-md mx-auto bg-slate-900/90 border border-slate-700 rounded-2xl px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-cyan-500">
      </div>
      <div id="toolsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <div id="tool-view" class="hidden">
      <div id="tool-container"></div>
    </div>
  </main>

  <footer class="text-center py-6 text-xs text-slate-500 border-t border-slate-800/80">
    Kho Tool Cộng Đồng • Modular Architecture • Zero Server Storage
  </footer>

  <script src="./core/shared.js"></script>
  <script src="./core/loader.js"></script>
  <script>
    let tools = [];

    async function init() {
      try {
        const res = await fetch('./manifest.json');
        tools = await res.json();
        renderTools(tools);
        const count = localStorage.getItem('ktcd_global_counter') || '128500';
        const el = document.getElementById('realTaskCounter');
        if (el) el.textContent = parseInt(count).toLocaleString('vi-VN');
      } catch (e) {
        document.getElementById('toolsGrid').innerHTML = '<p class="text-rose-400 text-center">Không tải được danh sách tool.</p>';
      }
    }

    function renderTools(list) {
      const grid = document.getElementById('toolsGrid');
      if (!list.length) {
        grid.innerHTML = '<p class="text-slate-500 col-span-full text-center py-10">Không tìm thấy tool nào.</p>';
        return;
      }
      grid.innerHTML = list.map(t => `
        <div onclick="openTool('${t.id}')" class="group bg-slate-900/60 hover:bg-slate-900/90 border border-slate-800 hover:border-cyan-500/40 p-6 rounded-2xl cursor-pointer transition-all duration-200 space-y-3 shadow-lg hover:shadow-cyan-500/5">
          <div class="flex justify-between items-start">
            <span class="text-2xl">${t.icon || '🔧'}</span>
            <span class="text-[10px] px-2 py-0.5 rounded-lg font-semibold ${
              t.status === 'live' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-amber-500/10 text-amber-400'
            }">${t.status === 'live' ? 'Live' : 'Beta'}</span>
          </div>
          <h3 class="font-bold text-white group-hover:text-cyan-400 transition">${t.name}</h3>
          <p class="text-xs text-slate-400 leading-relaxed">${t.description || ''}</p>
          <div class="pt-3 border-t border-slate-800/80 text-xs font-semibold text-cyan-400 flex justify-between">
            <span>Mở tool</span><span class="group-hover:translate-x-1 transition">→</span>
          </div>
        </div>
      `).join('');
    }

    function openTool(id) {
      const tool = tools.find(t => t.id === id);
      if (!tool) return;
      document.getElementById('hub-view').classList.add('hidden');
      document.getElementById('tool-view').classList.remove('hidden');
      document.getElementById('backBtn').classList.remove('hidden');
      KhoTool.loader.load(tool);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showHub() {
      document.getElementById('hub-view').classList.remove('hidden');
      document.getElementById('tool-view').classList.add('hidden');
      document.getElementById('backBtn').classList.add('hidden');
      KhoTool.loader.unload();
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) return renderTools(tools);
      const filtered = tools.filter(t =>
        t.name.toLowerCase().includes(q) ||
        (t.description || '').toLowerCase().includes(q) ||
        (t.tags || []).some(tag => tag.toLowerCase().includes(q))
      );
      renderTools(filtered);
    });

    init();
  </script>
</body>
</html>
