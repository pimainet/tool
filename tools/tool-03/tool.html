<div class="bg-slate-900/60 border border-slate-800 rounded-3xl p-6 sm:p-8 space-y-4 max-w-xl mx-auto">
  <div class="flex items-center justify-between">
    <h2 class="text-xl font-bold text-white">Instant Lead Notifier</h2>
    <span class="text-[10px] bg-purple-500/10 text-purple-400 px-2 py-1 rounded-lg">v2</span>
  </div>
  <p class="text-xs text-slate-400">Gửi thông báo lead qua Telegram. Có sẵn template để dùng nhanh.</p>

  <p class="text-[10px] text-amber-400/90 bg-amber-500/10 border border-amber-500/20 rounded-lg p-2">Token chỉ nằm trong trình duyệt này, không được lưu, và tin nhắn được gửi thẳng từ trình duyệt tới Telegram. Nên dùng một bot riêng chỉ để thông báo, không dùng bot chứa dữ liệu quan trọng.</p>
  <input type="text" id="m3-botToken" placeholder="Bot Token" class="w-full bg-slate-950 border border-slate-800 text-xs p-3 rounded-xl text-slate-200">
  <input type="text" id="m3-chatId" placeholder="Chat ID" class="w-full bg-slate-950 border border-slate-800 text-xs p-3 rounded-xl text-slate-200">

  <div>
    <label class="text-xs text-slate-400">Template nhanh</label>
    <select id="m3-templateSelect" class="w-full mt-1 bg-slate-950 border border-slate-800 text-xs p-3 rounded-xl text-slate-200">
      <option value="">-- Chọn template hoặc viết tay --</option>
      <option value="lead">Lead mới từ form</option>
      <option value="order">Đơn hàng mới</option>
      <option value="contact">Khách liên hệ</option>
    </select>
  </div>

  <textarea id="m3-message" rows="5" placeholder="Nội dung thông báo..." class="w-full bg-slate-950 border border-slate-800 text-xs p-3 rounded-xl text-slate-200"></textarea>

  <button id="m3-sendBtn" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs py-3 rounded-xl">Gửi Telegram</button>
  <div id="m3-status" class="text-xs text-center text-slate-400 min-h-[1rem]"></div>
</div>
