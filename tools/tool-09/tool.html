<div class="bg-slate-900/60 border border-slate-800 rounded-3xl p-6 sm:p-8 space-y-6">
  <div class="flex items-center justify-between">
    <h2 class="text-xl font-bold text-white">Universal Converter</h2>
    <span class="text-[10px] bg-indigo-500/10 text-indigo-400 px-2 py-1 rounded-lg">v2</span>
  </div>

  <div class="border-b border-slate-800 pb-5 space-y-3">
    <h3 class="text-sm font-semibold text-indigo-400">Excel / CSV / JSON</h3>
    <input type="file" id="m9-fileInput" accept=".xlsx,.xls,.csv,.json" class="text-xs text-slate-300">
    <div id="m9-fileActions" class="hidden space-y-3">
      <div class="text-xs text-slate-400" id="m9-fileInfo"></div>
      <div class="flex gap-2">
        <button id="m9-toJson" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-4 py-2 rounded-xl">Xuất JSON</button>
        <button id="m9-toCsv" class="bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold px-4 py-2 rounded-xl">Xuất CSV</button>
      </div>
      <div id="m9-preview" class="hidden bg-slate-950 border border-slate-800 rounded-xl p-3 text-[10px] font-mono text-slate-300 max-h-40 overflow-auto"></div>
    </div>
  </div>

  <div class="space-y-3">
    <h3 class="text-sm font-semibold text-pink-400">Chuyển định dạng ảnh</h3>
    <input type="file" id="m9-imageInput" accept="image/*" multiple class="text-xs text-slate-300">
    <select id="m9-imageFormatSelect" class="bg-slate-950 border border-slate-800 text-xs p-2 rounded-lg text-slate-200">
      <option value="image/jpeg">JPEG</option>
      <option value="image/png">PNG</option>
      <option value="image/webp">WebP</option>
    </select>
    <div id="m9-imageActionBox" class="hidden">
      <span id="m9-imageMeta" class="text-xs text-slate-400 block mb-2"></span>
      <button id="m9-convertImages" class="bg-pink-600 hover:bg-pink-500 text-white text-xs font-bold px-4 py-2 rounded-xl">Chuyển đổi ảnh</button>
    </div>
  </div>
</div>
