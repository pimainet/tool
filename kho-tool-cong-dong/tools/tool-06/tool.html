<style>
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
</style>
<div class="space-y-6">
  <div class="bg-slate-900/60 border border-slate-800 rounded-3xl p-6 sm:p-8 space-y-6">
    <div class="flex items-center justify-between border-b border-slate-800 pb-4">
      <div>
        <span class="text-[10px] bg-rose-500/10 text-rose-400 px-2.5 py-1 rounded-lg border border-rose-500/20 font-bold">Tool 06</span>
        <h2 class="text-xl font-extrabold text-white mt-1">Executive Dashboard Builder</h2>
      </div>
      <span class="text-[10px] bg-emerald-500/10 text-emerald-400 px-2 py-1 rounded-lg">v11</span>
    </div>

    <div id="m6-uploadSection" class="space-y-6">
      <label class="flex flex-col items-center justify-center border-2 border-dashed border-slate-700 hover:border-rose-500 bg-slate-950/40 hover:bg-slate-950/80 rounded-2xl p-10 cursor-pointer transition text-center group max-w-xl mx-auto">
        <div class="w-14 h-14 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center mb-3 text-2xl">📊</div>
        <span class="text-sm text-slate-200 font-bold">Tải lên file Excel / CSV</span>
        <span class="text-[11px] text-slate-500 mt-1">.xlsx, .xls, .csv • Xử lý trên trình duyệt</span>
        <input type="file" id="m6-excelInput" accept=".xlsx,.xls,.csv" class="hidden">
      </label>

      <div id="m6-wizardBox" class="hidden border-t border-slate-800 pt-6 space-y-4">
        <div class="flex justify-between items-center">
          <h3 class="text-xs font-bold text-rose-400">Cấu hình báo cáo</h3>
          <span id="m6-rowCount" class="text-xs bg-slate-800 px-3 py-1 rounded-lg text-slate-300"></span>
        </div>

        <div id="m6-sheetBox" class="hidden">
          <label class="text-xs text-slate-300">Sheet</label>
          <select id="m6-sheetSelect" class="w-full mt-1 p-2.5 text-xs bg-slate-900 border border-slate-700 rounded-lg text-slate-200"></select>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="bg-slate-950/60 border border-slate-800 p-4 rounded-xl space-y-2">
            <label class="text-xs text-slate-300 font-semibold">Cột Phân Loại</label>
            <select id="m6-catColSelect" class="w-full p-2.5 text-xs bg-slate-900 border border-slate-700 rounded-lg text-slate-200"></select>
          </div>
          <div class="bg-slate-950/60 border border-slate-800 p-4 rounded-xl space-y-2">
            <label class="text-xs text-slate-300 font-semibold">Cột Giá Trị Số</label>
            <select id="m6-valColSelect" class="w-full p-2.5 text-xs bg-slate-900 border border-slate-700 rounded-lg text-slate-200"></select>
          </div>
          <div class="bg-slate-950/60 border border-slate-800 p-4 rounded-xl space-y-2">
            <label class="text-xs text-slate-300 font-semibold">Cột Thời Gian</label>
            <select id="m6-dateColSelect" class="w-full p-2.5 text-xs bg-slate-900 border border-slate-700 rounded-lg text-slate-200">
              <option value="">-- Không dùng --</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="text-xs text-slate-300">Tên công ty</label>
            <input type="text" id="m6-companyName" placeholder="Ví dụ: Công ty ABC" class="w-full mt-1 p-2.5 text-xs bg-slate-900 border border-slate-700 rounded-lg text-slate-200">
          </div>
          <div>
            <label class="text-xs text-slate-300">Logo công ty (tuỳ chọn)</label>
            <input type="file" id="m6-logoInput" accept="image/*" class="w-full mt-1 text-xs text-slate-300">
            <div id="m6-logoPreviewBox" class="hidden mt-3 space-y-2">
              <div class="relative inline-block border border-slate-700 rounded-lg overflow-hidden">
                <img id="m6-logoPreview" class="max-h-32">
                <div id="m6-cropBox" class="absolute border-2 border-cyan-400 bg-cyan-400/20 cursor-move" style="display:none;"></div>
              </div>
              <div class="flex gap-2">
                <button id="m6-cropBtn" type="button" class="text-xs bg-cyan-600 hover:bg-cyan-500 text-white px-3 py-1.5 rounded-lg">Cắt logo</button>
                <button id="m6-resetCropBtn" type="button" class="text-xs bg-slate-700 hover:bg-slate-600 text-white px-3 py-1.5 rounded-lg">Dùng ảnh gốc</button>
              </div>
              <p class="text-[10px] text-slate-500">Kéo chuột trên ảnh để chọn vùng logo, rồi bấm Cắt logo.</p>
            </div>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="text-xs text-slate-300">Tiêu đề báo cáo</label>
            <input type="text" id="m6-reportTitle" value="Báo cáo tổng quan" class="w-full mt-1 p-2.5 text-xs bg-slate-900 border border-slate-700 rounded-lg text-slate-200">
          </div>
          <div>
            <label class="text-xs text-slate-300">Hiển thị</label>
            <select id="m6-topN" class="w-full mt-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200">
              <option value="5">Top 5</option>
              <option value="8" selected>Top 8</option>
              <option value="10">Top 10</option>
              <option value="0">Tất cả</option>
            </select>
          </div>
        </div>

        <div class="flex justify-end pt-2">
          <button id="m6-buildBtn" class="bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white text-xs font-bold py-3 px-8 rounded-xl">
            Tạo Báo Cáo
          </button>
        </div>
      </div>
    </div>

    <div id="m6-dashboardSection" class="hidden space-y-6">
      <div class="flex justify-between items-center bg-slate-950/60 p-4 rounded-xl border border-slate-800">
        <span id="m6-reportHeader" class="text-sm font-bold text-slate-200">Báo cáo tổng quan</span>
        <div class="flex gap-2">
          <button id="m6-printBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-1.5 rounded-lg">Xuất PDF chuyên nghiệp</button>
          <button id="m6-resetBtn" class="bg-slate-800 text-slate-300 text-xs px-3 py-1.5 rounded-lg border border-slate-700">Nạp file khác</button>
        </div>
      </div>

      <div id="m6-filterBar" class="hidden flex flex-wrap gap-3 items-center bg-slate-950/40 p-3 rounded-xl border border-slate-800">
        <span class="text-xs text-slate-400">Lọc:</span>
        <input type="text" id="m6-filterText" placeholder="Tìm nhóm..." class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 w-36">
        <input type="number" id="m6-filterMin" placeholder="Giá trị từ" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 w-28">
        <input type="number" id="m6-filterMax" placeholder="Đến" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200 w-28">
        <button id="m6-applyFilter" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-1.5 rounded-lg">Áp dụng</button>
        <button id="m6-clearFilter" class="text-xs text-slate-400 hover:text-slate-200">Xóa lọc</button>
      </div>

      <div id="m6-reportContent" class="space-y-6">
        <div id="m6-insightBox" class="hidden bg-slate-950/60 border border-slate-800 rounded-xl p-4">
          <div class="text-[10px] text-slate-400 uppercase font-bold mb-2">Nhận xét tự động</div>
          <div id="m6-insightText" class="text-xs text-slate-300 leading-relaxed"></div>
        </div>

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
          <div class="bg-slate-950/60 border border-slate-800 p-4 rounded-xl">
            <span class="text-[10px] text-slate-400 uppercase font-bold">Tổng giá trị</span>
            <div id="m6-kpiTotal" class="text-xl font-black text-rose-400">0</div>
          </div>
          <div class="bg-slate-950/60 border border-slate-800 p-4 rounded-xl">
            <span class="text-[10px] text-slate-400 uppercase font-bold">Trung bình</span>
            <div id="m6-kpiAvg" class="text-xl font-black text-emerald-400">0</div>
          </div>
          <div class="bg-slate-950/60 border border-slate-800 p-4 rounded-xl">
            <span class="text-[10px] text-slate-400 uppercase font-bold">Số dòng</span>
            <div id="m6-kpiCount" class="text-xl font-black text-indigo-400">0</div>
          </div>
          <div class="bg-slate-950/60 border border-slate-800 p-4 rounded-xl">
            <span class="text-[10px] text-slate-400 uppercase font-bold">Dẫn đầu</span>
            <div id="m6-kpiTop" class="text-sm font-bold text-amber-400 truncate">-</div>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <div class="bg-slate-950/60 border border-slate-800 p-4 rounded-xl h-72">
            <canvas id="m6-barChart"></canvas>
          </div>
          <div class="bg-slate-950/60 border border-slate-800 p-4 rounded-xl h-72">
            <canvas id="m6-doughnutChart"></canvas>
          </div>
        </div>

        <div id="m6-timeChartBox" class="hidden bg-slate-950/60 border border-slate-800 p-4 rounded-xl h-72">
          <canvas id="m6-lineChart"></canvas>
        </div>

        <div class="bg-slate-950/60 border border-slate-800 rounded-xl overflow-hidden">
          <div class="px-4 py-3 border-b border-slate-800 text-xs font-semibold text-slate-300">Chi tiết theo nhóm</div>
          <div class="overflow-x-auto">
            <table class="w-full text-xs">
              <thead class="bg-slate-900/50 text-slate-400">
                <tr>
                  <th class="text-left px-4 py-2 font-medium">Nhóm</th>
                  <th class="text-right px-4 py-2 font-medium">Giá trị</th>
                  <th class="text-right px-4 py-2 font-medium">Tỷ lệ</th>
                </tr>
              </thead>
              <tbody id="m6-detailTable" class="text-slate-200"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
